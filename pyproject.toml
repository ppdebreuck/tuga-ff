[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuga-ff"
dynamic = ["version"]
description = "TugaFF: a pretrained machine-learned force field with an ASE calculator interface"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Pierre-Paul De Breuck", email = "pierre-paul.debreuck@rub.de" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics",
    "pymatgen>=2023.0.0",
    "numpy",
    "ase",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/ppdebreuck/tuga-ff"
Repository = "https://github.com/ppdebreuck/tuga-ff"

[tool.hatch.version]
path = "src/tugaff/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tugaff"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
